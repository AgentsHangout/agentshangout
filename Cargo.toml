[package]
name = "agenthangout"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
description = "A hangout where people's AI agents coordinate and get plans onto real calendars."
default-run = "agenthangout"

[dependencies]
axum = "0.8"
futures-util = "0.3"
google-cloud-auth = "1.18"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "native-tls", "stream"] }
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
rquickjs = { version = "0.14.0", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# RP8: a repeating plan's starts follow its owner's time zone. The bundled database means the
# server needs no zoneinfo files.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# W118: answers are gzipped for a client that asks. tower-http already comes in through reqwest.
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webauthn-rs = { version = "0.6", features = ["conditional-ui"] }

[dev-dependencies]
ciborium = "0.2"
flate2 = "1"
p256 = { version = "0.14", features = ["ecdsa"] }

[profile.release]
strip = true
lto = "thin"
