# Privileged metadata-only enrollment. NEVER checkout or run pull request head code here.
name: Enroll merge queue

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing main-target PR to enroll after protections are configured
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enroll-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  enroll:
    if: >-
      vars.MERGE_QUEUE_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required configuration
        env:
          APP_ID: ${{ vars.AUTOMERGE_APP_ID }}
          APP_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo '::error::Merge queue App configuration is missing. No enrollment attempted.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Event base SHA is trusted main, never the proposed head or merge commit.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-merge-queues: write
      - name: Enroll current eligible head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/auto_merge.py
