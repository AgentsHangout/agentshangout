<!doctype html>
<meta charset="utf-8">
<title>Phone room regression checks</title>
<style>body { margin: 12px; font: 14px system-ui; } iframe { width: 393px; height: 852px; border: 1px solid #888; } pre { white-space: pre-wrap; }</style>
<pre id="results">Running…</pre>
<script type="module">
if (!location.search) {
  const reports = new Map();
  const frames = ['portrait', 'landscape'].map(orientation => {
    const frame = document.createElement('iframe');
    frame.src = `?frame=${orientation}`;
    frame.title = `${orientation} phone room`;
    frame.style.width = orientation === 'portrait' ? '393px' : '852px';
    frame.style.height = orientation === 'portrait' ? '852px' : '393px';
    document.body.append(frame);
    return frame;
  });
  addEventListener('message', event => {
    const frame = frames.find(frame => event.source === frame.contentWindow);
    if (!frame) return;
    reports.set(frame.title, event.data);
    document.querySelector('#results').textContent = [...reports].map(([name, report]) => `${name}\n${report}`).join('\n\n');
  });
} else {
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = `../../web/style.css?fixture=${Date.now()}`;
  const loaded = new Promise(resolve => { css.onload = resolve; });
  document.head.append(css); await loaded;
  document.querySelector('#results').remove();
  const source = (await (await fetch('../../web/app.js', {cache: 'no-store'})).text()).replace(/\r\n/g, '\n');
  const hStart = source.indexOf('function h(');
  const hSource = source.slice(hStart, source.indexOf('\n}\n', hStart) + 3);
  const panelSource = source.slice(source.indexOf('function createPanels('), source.indexOf('\n// What goes in the panels'));
  const dragSource = source.includes('function installSheetDrag(')
    ? source.slice(source.indexOf('function installSheetDrag('), source.indexOf('\nfunction createPanels(')) : '';
  const cameraSource = source.includes('function installRoomCamera(')
    ? source.slice(source.indexOf('function installRoomCamera('), source.indexOf('\nfunction installAppleHigRoom(')) : '';
  const {h, createPanels, installSheetDrag, installRoomCamera} = new Function(`${hSource}\n${dragSource}\n${panelSource}\n${cameraSource}\nreturn {h,createPanels,installSheetDrag: typeof installSheetDrag === 'function' ? installSheetDrag : null, installRoomCamera: typeof installRoomCamera === 'function' ? installRoomCamera : null};`)();
  // Use the actual production frame: .room-host is INSIDE .wd-well. Combining those
  // classes concealed the double navigation inset that only appeared on real phones.
  const {windowFrame} = await import('../../web/city.js');
  const frame = windowFrame({label:'Demo room', stats:[], heading:'h1'});
  const root = frame.root;
  root.classList.add('wd-game', 'wd-room', 'apple-hig');
  const host = frame.host;
  host.classList.add('room-host');
  host.append(h('section', {class:'stage'}));
  const status = frame.status;
  status.replaceChildren(
    h('nav', {class: 'wd-seg floors'}, 'Repeated floor information'),
    h('span', {class: 'room-note'}, 'The buttons along the top…'),
    h('span', {class: 'room-quiet', hidden: true}, 'Quiet sign up'),
    h('span', {class: 'room-guest', hidden: true}, 'Guest access'));
  const navSource = source.slice(source.indexOf('function installAppleHigRoom('), source.indexOf('\n}\n', source.indexOf('function installAppleHigRoom(')) + 2);
  const noticeSource = source.slice(source.indexOf('function syncRoomNotices('), source.indexOf('\n}\n', source.indexOf('function syncRoomNotices(')) + 2);
  let destination;
  const installNav = new Function('h', 'watchPhoneChrome', 'go', `${navSource}; return installAppleHigRoom;`)(h, () => {}, path => { destination = path; });
  const syncNotices = new Function('h', `${noticeSource}; return syncRoomNotices;`)(h);

  document.body.append(root);
  const {Room} = await import('../../web/room.js');
  const room = new Room(host.querySelector('.stage'));
  room.setBots([{id:'fixture-bot', name:'Demo bot',color:'#3ddc97',state:'active'}]);
  room.setPeople([{id:'fixture-person', name:'Demo guest',color:'#ffb454'}]);
  const cameraStage = host.querySelector('.stage');
  const stopCamera = installRoomCamera?.(host, cameraStage);
  const panels = createPanels(root);
  const inlineNotices = h('div', {class:'phone-room-notices'});
  panels.add('room', 'Chat', {}, inlineNotices, h('div', {class:'chat-log'}, 'A real message'), h('form', {class:'chat-form'}, h('input', {placeholder:'Message'})));
  installNav({frame, panels});
  panels.open('room');
  await new Promise(resolve => setTimeout(resolve, 400));
  const panel = root.querySelector('.game-panel');
  const grabber = panel.querySelector('.sheet-grabber');
  const lines = [];
  const check = (ok, text) => lines.push(`${ok ? 'PASS' : 'FAIL'}: ${text}`);
  root.querySelector('[data-tab=world]').click();
  check(destination === '/world/commons', 'M8: World returns directly to the outside map');
  root.querySelector('[data-tab=room]').click();
  check(panels.current === null, 'M8: Room returns to the interior');
  panels.open('room');
  await new Promise(resolve => setTimeout(resolve, 400));
  const guestNotice = status.querySelector('.room-guest');
  guestNotice.hidden = false;
  guestNotice.textContent = 'Guest access until tomorrow. Only new messages are visible.';
  syncNotices([inlineNotices], [guestNotice]);
  check(inlineNotices.textContent === guestNotice.textContent && panel.contains(inlineNotices), 'M8: guest expiry belongs inside the Chat sheet');
  check(getComputedStyle(inlineNotices).position === 'static', 'M8: notices take up space without overlaying the composer');
  guestNotice.hidden = true;
  syncNotices([inlineNotices], [guestNotice]);
  check(inlineNotices.hidden && !inlineNotices.childElementCount, 'M8: stale guest notices disappear');
  const visible = el => getComputedStyle(el).display !== 'none' && el.getBoundingClientRect().height > 0;
  check(grabber.getBoundingClientRect().height >= 44, 'M3: grabber has a 44px or larger touch target');
  function pointer(type, y, target = grabber) {
    target.dispatchEvent(new PointerEvent(type, {bubbles:true, pointerId:7, pointerType:'touch', clientY:y, button:0, isPrimary:true}));
  }
  pointer('pointerdown', 100); pointer('pointermove', 180); pointer('pointerup', 180);
  check(panel.hidden && panels.current === null, 'M3: dragging down dismisses the sheet');
  panels.open('room');
  await new Promise(resolve => setTimeout(resolve, 400));
  pointer('pointerdown', 100); pointer('pointermove', 125); pointer('pointercancel', 125);
  check(!panel.hidden && getComputedStyle(panel).transform === 'matrix(1, 0, 0, 1, 0, 0)', 'M3: interrupted short drag restores the open sheet');
  pointer('pointerdown', 100); pointer('pointermove', 125); pointer('pointerup', 125);
  grabber.dispatchEvent(new MouseEvent('click', {bubbles:true, detail:1}));
  check(!panel.hidden, 'M3: a synthesized click after a short drag does not dismiss the sheet');
  check(getComputedStyle(panel.querySelector('.game-panel-head')).backgroundImage === 'none', 'M3: phone header has no nested desktop title bar');
  check(getComputedStyle(panel.querySelector('.game-panel-body')).boxShadow === 'none', 'M3: phone body has no nested bevel frame');
  panels.close(false);
  check(!visible(status), 'M4: desktop room readouts do not cover the phone scene');
  status.querySelector('.room-quiet').hidden = false;
  check(!visible(status), 'M8: quiet-room warning never creates a floating phone status strip');
  check(!visible(status.querySelector('.floors')), 'M4: warnings do not restore redundant floor readouts');
  const stage = host.querySelector('.stage').getBoundingClientRect();
  const hostRect = host.getBoundingClientRect();
  const wellRect = root.querySelector('.wd-well').getBoundingClientRect();
  check(stage.left >= hostRect.left - 1 && stage.right <= hostRect.right + 1
    && stage.top >= hostRect.top - 1 && stage.bottom <= hostRect.bottom + 1,
    'M4: the whole room fits inside its camera by default');
  check(Math.abs(hostRect.left - wellRect.left) < 1 && Math.abs(hostRect.right - wellRect.right) < 1,
    'M4: the room camera has no second landscape navigation inset');
  check(host.scrollWidth <= host.clientWidth + 1,
    'M4: default room camera has no horizontal crop or scroll gutter');
  check(Math.abs(stage.width / stage.height - 480 / 252) < .02, 'M4: pixel room keeps its original aspect ratio');
  check(!!installRoomCamera, 'M4: room camera uses the production gesture helper');
  if (installRoomCamera) {
    let clicks = 0;
    const button = h('button', {onclick: () => clicks++}, 'Camera tap probe');
    cameraStage.append(button);
    const cx = hostRect.left + hostRect.width / 2;
    const cy = hostRect.top + hostRect.height / 2;
    const cameraPointer = (type, id, x, y, target = cameraStage) => target.dispatchEvent(new PointerEvent(type, {
      bubbles:true, cancelable:true, pointerId:id, pointerType:'touch', clientX:x, clientY:y, button:0, isPrimary:id===1,
    }));
    cameraPointer('pointerdown',1,cx,cy,button); cameraPointer('pointerup',1,cx,cy,button);
    button.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:1}));
    check(clicks === 1, 'M4: an ordinary tap still reaches room controls');
    cameraPointer('pointerdown',1,cx-40,cy); cameraPointer('pointerdown',2,cx+40,cy);
    cameraPointer('pointermove',1,cx-80,cy); cameraPointer('pointermove',2,cx+80,cy);
    cameraPointer('pointerup',1,cx-80,cy); cameraPointer('pointerup',2,cx+80,cy);
    const enlarged = cameraStage.getBoundingClientRect();
    check(Math.abs(enlarged.width / stage.width - 2) < .02, 'M4: a deliberate pinch enlarges the room');
    cameraPointer('pointerdown',1,cx,cy); cameraPointer('pointermove',1,cx+40,cy);
    cameraPointer('pointerup',1,cx+40,cy);
    const moved = cameraStage.getBoundingClientRect();
    check(moved.left > enlarged.left + 5, 'M4: one finger pans the deliberately enlarged room');
    button.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:1}));
    check(clicks === 1, 'M4: panning does not accidentally activate room controls');
    cameraPointer('pointerdown',1,cx,cy); cameraPointer('pointercancel',1,cx,cy);
    cameraStage.dispatchEvent(new MouseEvent('dblclick',{bubbles:true,cancelable:true}));
    const reset = cameraStage.getBoundingClientRect();
    check(Math.abs(reset.width - stage.width) < 1, 'M4: double tapping the scene restores the complete room');
    cameraStage.classList.add('building');
    cameraPointer('pointerdown',1,cx-40,cy); cameraPointer('pointerdown',2,cx+40,cy);
    cameraPointer('pointermove',1,cx-80,cy); cameraPointer('pointermove',2,cx+80,cy);
    cameraPointer('pointerup',1,cx-80,cy); cameraPointer('pointerup',2,cx+80,cy);
    check(Math.abs(cameraStage.getBoundingClientRect().width - stage.width) < 1, 'M4: room building gestures are not intercepted by the camera');
    cameraStage.classList.remove('building');
    button.remove();
  }
  if (installSheetDrag) {
    const buildHandle = h('button', {class:'sheet-grabber'});
    const build = h('div', {class:'apple-build-sheet open'}, buildHandle);
    root.append(build);
    installSheetDrag(buildHandle, build, () => build.classList.remove('open'));
    pointer('pointerdown',100,buildHandle); pointer('pointermove',180,buildHandle);
    check(getComputedStyle(build).transform === 'matrix(1, 0, 0, 1, 0, 80)', 'M3: build sheet follows the drag despite its open transform');
    pointer('pointerup',180,buildHandle);
    check(!build.classList.contains('open'), 'M3: the same gesture dismisses building tools');
    build.remove();
  }
  root.classList.remove('apple-hig');
  check(!visible(grabber), 'M3: desktop has no phone drag handle');
  check(visible(status.querySelector('.floors')), 'M4: desktop keeps floor navigation in its status bar');
  check(!cameraStage.style.transform, 'M4: desktop never receives a phone camera transform');
  root.classList.add('apple-hig');
  status.querySelector('.room-quiet').hidden = true;
  parent.postMessage(lines.join('\n'), location.origin);
}
</script>
